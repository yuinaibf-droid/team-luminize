<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>【公式】Team Luminize</title>
  <meta name="description" content="Team Luminize（チーム・ルミナイズ）公式サイト。所属クリエイターの最新動画・お知らせ・実績をお届けします。">
  <meta property="og:title" content="【公式】Team Luminize">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/img/logo-full.png">
  <meta property="og:description" content="Team Luminize 所属クリエイターの最新動画・お知らせ・実績">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header" data-header></header>

  <main>
    <section class="hero" aria-label="Team Luminize">
      <div class="streaks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="wrap hero-grid">
        <div>
          <h1 class="hero-word"><span class="hero-team">Team</span>Luminize</h1>
          <p class="hero-title" data-s="hero_title">光る個性を、もっと遠くへ。</p>
          <p class="hero-sub" data-s="hero_sub"></p>
          <div class="hero-actions">
            <a class="btn btn-glow" href="#creators">クリエイターを見る</a>
            <a class="btn" href="#contact">お問い合わせ</a>
          </div>
        </div>
        <img class="hero-logo" src="/assets/img/logo-full.png" alt="LUMINIZE ロゴ" width="428" height="357">
      </div>
    </section>

    <section class="section" id="about">
      <div class="wrap">
        <div class="sec-head"><h2 class="sec-title"><span>About</span><small>Team Luminize について</small></h2></div>
        <div class="about-grid">
          <p class="about-lead" data-s="about_title"></p>
          <div class="about-body" data-about></div>
        </div>
      </div>
    </section>

    <section class="section alt" id="news">
      <div class="wrap">
        <div class="sec-head"><h2 class="sec-title"><span>News</span><small>お知らせ</small></h2><a class="more" href="/news">お知らせ一覧</a></div>
        <ul class="news-list" data-news><li class="loading">読み込み中…</li></ul>
      </div>
    </section>

    <section class="section" id="creators">
      <div class="wrap">
        <div class="sec-head"><h2 class="sec-title"><span>Creators</span><small>所属クリエイター</small></h2></div>
        <div class="creator-grid" data-creators></div>
      </div>
    </section>

    <section class="section alt" id="movie">
      <div class="wrap">
        <div class="sec-head"><h2 class="sec-title"><span>Movie</span><small>所属クリエイターの最新動画</small></h2></div>
        <div class="movie-grid" data-movie></div>
      </div>
    </section>

    <section class="section" id="works">
      <div class="wrap">
        <div class="sec-head"><h2 class="sec-title"><span>Works</span><small>実績</small></h2></div>
        <div class="works-list" data-works></div>
      </div>
    </section>

    <section class="section alt" id="contact">
      <div class="wrap contact-grid">
        <div>
          <div class="sec-head"><h2 class="sec-title"><span>Contact</span><small>お問い合わせ</small></h2></div>
          <p class="contact-note" data-s="contact_note"></p>
        </div>
        <form class="form" data-contact novalidate>
          <div class="form-row">
            <div class="field"><label for="f-name">お名前<span class="req">必須</span></label><input id="f-name" name="name" autocomplete="name" required maxlength="100"></div>
            <div class="field"><label for="f-company">会社名・団体名</label><input id="f-company" name="company" autocomplete="organization" maxlength="100"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="f-email">メールアドレス<span class="req">必須</span></label><input id="f-email" name="email" type="email" autocomplete="email" required maxlength="200"></div>
            <div class="field"><label for="f-type">お問い合わせの種類</label>
              <select id="f-type" name="type">
                <option>企業案件・PRのご相談</option><option>コラボのご相談</option><option>取材・メディア出演</option>
                <option>所属・オーディションについて</option><option>その他</option>
              </select>
            </div>
          </div>
          <div class="field"><label for="f-msg">お問い合わせ内容<span class="req">必須</span></label><textarea id="f-msg" name="message" required maxlength="5000"></textarea></div>
          <input type="checkbox" name="botcheck" class="sr-only" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="form-status" data-form-status hidden role="status"></div>
          <div class="form-foot">
            <button class="btn btn-glow" type="submit">送信する</button>
            <small>送信内容は Team Luminize 運営チームに届きます。</small>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/home.js"></script>
</body>
</html>
