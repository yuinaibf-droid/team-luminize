<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>管理画面 | Team Luminize</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <!-- ログイン -->
  <section class="login" data-view="login" hidden>
    <form class="login-box" data-login>
      <div class="login-brand"><img src="/assets/img/logo-mark.png" alt="">Team Luminize</div>
      <h1>管理画面にログイン</h1>
      <label for="pw">パスワード</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="err" data-login-err hidden></p>
      <button class="b b-primary" type="submit">ログイン</button>
      <a class="sub" href="/">公式サイトへ戻る</a>
    </form>
  </section>

  <!-- ダッシュボード -->
  <div class="app" data-view="app" hidden>
    <aside class="side">
      <div class="side-brand"><img src="/assets/img/logo-mark.png" alt="">Team Luminize<small>管理画面</small></div>
      <nav class="side-nav" data-tabs>
        <button data-tab="creators" class="is-active">クリエイター</button>
        <button data-tab="news">お知らせ</button>
        <button data-tab="works">実績</button>
        <button data-tab="videos">動画</button>
        <button data-tab="settings">サイト設定</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener">サイトを表示</a>
        <button type="button" data-logout>ログアウト</button>
      </div>
    </aside>
    <main class="main" data-main></main>
  </div>

  <dialog class="drawer" data-drawer>
    <form method="dialog" class="drawer-form" data-drawer-form novalidate>
      <header class="drawer-head">
        <h2 data-drawer-title></h2>
        <button class="x" value="cancel" formnovalidate aria-label="閉じる">×</button>
      </header>
      <div class="drawer-body" data-drawer-body></div>
      <footer class="drawer-foot">
        <button class="b b-danger" type="button" data-delete hidden>削除</button>
        <span class="spacer"></span>
        <button class="b" value="cancel" formnovalidate>キャンセル</button>
        <button class="b b-primary" type="submit" value="save" data-save>保存する</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
