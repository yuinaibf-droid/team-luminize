<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お知らせ | Team Luminize</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header" data-header></header>
  <main>
    <section class="page-head"><div class="wrap"><h1 class="sec-title"><span>News</span><small>お知らせ</small></h1></div></section>
    <section class="wrap" style="padding-bottom:120px"><ul class="news-list" data-news><li class="loading">読み込み中…</li></ul></section>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script type="module">
    import { api, esc, fmtDate, renderChrome } from '/assets/js/common.js';
    renderChrome();
    const ul = document.querySelector('[data-news]');
    api('news').then(({ news }) => {
      ul.innerHTML = news.length ? news.map((n) => `
        <li><a href="/news/${n.id}">
          <time class="news-date" datetime="${esc(n.published_at)}">${fmtDate(n.published_at)}</time>
          <span class="chip">${esc(n.category)}</span><span class="news-t">${esc(n.title)}</span>
        </a></li>`).join('') : '<li class="empty">お知らせはまだありません。</li>';
    }).catch((e) => { ul.innerHTML = `<li class="empty">${esc(e.message)}</li>`; });
  </script>
</body>
</html>
