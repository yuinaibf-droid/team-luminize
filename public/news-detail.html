<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お知らせ | Team Luminize</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header" data-header></header>
  <main class="article"><div class="wrap" data-article><div class="loading">読み込み中…</div></div></main>
  <footer class="site-footer" data-footer></footer>
  <script type="module">
    import { api, esc, fmtDate, renderBody, renderChrome } from '/assets/js/common.js';
    renderChrome();
    const el = document.querySelector('[data-article]');
    const id = location.pathname.split('/news/')[1] || new URLSearchParams(location.search).get('id');
    api(`news/${encodeURIComponent(id)}`).then(({ news: n }) => {
      document.title = `${n.title} | Team Luminize`;
      el.innerHTML = `
        <div class="meta"><time datetime="${esc(n.published_at)}">${fmtDate(n.published_at)}</time><span class="chip">${esc(n.category)}</span></div>
        <h1>${esc(n.title)}</h1>
        ${n.thumbnail ? `<div class="thumb"><img src="${esc(n.thumbnail)}" alt=""></div>` : ''}
        <div class="body">${renderBody(n.body)}</div>
        <a class="more back" href="/news">お知らせ一覧へ戻る</a>`;
    }).catch((e) => { el.innerHTML = `<p class="empty">${esc(e.message)}</p><a class="more back" href="/news">お知らせ一覧へ戻る</a>`; });
  </script>
</body>
</html>
